name: Publish

on:
  push:
    branches: [main]
    paths:
      - "queue/inbox/**"
      - "content/**"
      - "scripts/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build site
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/publish-queue.mjs

      - name: Commit generated posts
        run: |
          git add index.html style.css .nojekyll posts content queue/inbox
          if git diff --cached --quiet; then
            echo "No file changes."
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Publish queued posts"
            git push origin HEAD:main
          fi
